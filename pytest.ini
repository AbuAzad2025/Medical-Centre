[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    e2e: end-to-end production flow tests (requires PostgreSQL)
    no_tenant_context: opt out of autouse SaaS tenant binding for isolation tests
    concurrency: race-condition tests (real threads against PostgreSQL)
    no_isolation: test needs real commits; excluded from the rollback fixture
filterwarnings =
    ignore::sqlalchemy.exc.LegacyAPIWarning

[coverage:run]
source =
    app
    routes
    services
    models
    utils
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */venv/*
    */mockups/*

[coverage:report]
precision = 1
show_missing = false
skip_covered = true
fail_under = 0
