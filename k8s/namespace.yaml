apiVersion: v1
kind: Namespace
metadata:
  name: medical-system
  labels:
    name: medical-system
    tenant-isolation: "rls-enforced"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medical-config
  namespace: medical-system
data:
  FLASK_ENV: "production"
  ENABLE_SAAS_MODE: "true"
  DEPLOYMENT_MODE: "saas"
  CELERY_ENABLED: "true"
  HOST: "0.0.0.0"
  PORT: "8080"
  # Tenant isolation: every service must propagate X-Tenant-ID header
  TENANT_ISOLATION_MODE: "rls"
  RLS_BYPASS_ALLOWED: "0"
---
apiVersion: v1
kind: Secret
metadata:
  name: medical-secrets
  namespace: medical-system
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME_IN_PRODUCTION"
  DATABASE_URL: "postgresql://postgres:changeme@postgres:5432/medical_system"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  PG_USER: "postgres"
  PG_PASSWORD: "changeme"
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""
---