# API Gateway — routes traffic to microservices
# Tenant isolation: X-Tenant-ID header is propagated to all services
upstream core_api {
    server core-api:8080;
}
upstream pharmacy_service {
    server pharmacy-service:8080;
}
upstream lab_service {
    server lab-service:8080;
}
upstream billing_service {
    server billing-service:8080;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Tenant isolation: propagate tenant context
    proxy_set_header X-Tenant-ID $http_x_tenant_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    # Core API (auth, patients, visits, users, reception, doctor, nursing, emergency)
    location /api/ {
        proxy_pass http://core_api;
    }
    location /auth/ {
        proxy_pass http://core_api;
    }
    location /reception/ {
        proxy_pass http://core_api;
    }
    location /doctor/ {
        proxy_pass http://core_api;
    }

    # Pharmacy service
    location /medication/ {
        proxy_pass http://pharmacy_service;
    }
    location /pharmacy/ {
        proxy_pass http://pharmacy_service;
    }

    # Lab service
    location /lab/ {
        proxy_pass http://lab_service;
    }
    location /api/lab/ {
        proxy_pass http://lab_service;
    }

    # Billing service
    location /accountant/ {
        proxy_pass http://billing_service;
    }
    location /billing/ {
        proxy_pass http://billing_service;
    }
    location /payment/ {
        proxy_pass http://billing_service;
    }

    # Static assets (CDN)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # In production, replace with CDN origin
        proxy_pass http://core_api;
    }

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
---