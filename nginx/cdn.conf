# CDN configuration for static assets
# Place this in nginx sites-enabled or include in main config

# Static asset cache zone
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m
    max_size=10g inactive=365d use_temp_path=off;

server {
    listen 80;
    server_name cdn.medical.example.com;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "public, max-age=31536000, immutable";

    # Static assets with long-term caching
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";

        # CORS for CDN
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";

        # Gzip compression
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        gzip_min_length 256;

        # ETag for cache validation
        etag on;
    }

    # Uploaded files (shorter cache, tenant-isolated)
    location /static/uploads/ {
        alias /app/static/uploads/;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
        # Tenant isolation: uploads are tenant-scoped
        add_header X-Tenant-Isolated "true";
    }

    # Health check
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
---