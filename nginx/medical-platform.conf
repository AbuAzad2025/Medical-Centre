# Nginx Production Configuration for Medical Centre Platform
# Place this file at: /etc/nginx/sites-available/medical-platform
# Then symlink: ln -s /etc/nginx/sites-available/medical-platform /etc/nginx/sites-enabled/
# Test: nginx -t
# Reload: systemctl reload nginx

# Upstream backend servers
upstream medical_backend {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    # Add more backend servers for scaling:
    # server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=health_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;

# Rate limiting for WebSocket connections
limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

# Upstream health check
upstream medical_backend_health {
    server 127.0.0.1:8080;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name medical-platform.example.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name medical-platform.example.com;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/medical-platform.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medical-platform.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/medical-platform.example.com/chain.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS (enable after confirming everything works)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self \"https://api.stripe.com\")" always;

    # Client body settings
    client_max_body_size 20M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 30s;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # Health check endpoint (no rate limiting)
    location = /health {
        limit_req zone=health_limit burst=20 nodelay;
        proxy_pass http://medical_backend;
        access_log off;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://medical_backend;
    }

    # Authentication endpoints - stricter rate limiting
    location ~ ^/(auth|login|register|password|mfa|2fa) {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://medical_backend;
    }

    # File upload endpoints - stricter rate limiting
    location ~ ^/(upload|import|export|backup) {
        limit_req zone=upload_limit burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 50M;
        proxy_pass http://medical_backend;
    }

    # WebSocket connections
    location /socket.io/ {
        limit_conn ws_conn 10;
        proxy_pass http://medical_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static files with caching
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Media files with caching
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        alias /app/static/favicon.ico;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        alias /app/static/robots.txt;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Main application proxy
    location / {
        proxy_pass http://medical_backend;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /404.html {
        root /app/templates/errors;
        internal;
    }
    location = /50x.html {
        root /app/templates/errors;
        internal;
    }

    # Block access to sensitive files
    location ~ /\.(git|env|htaccess|htpasswd) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(py|pyc|pyo|pyd|sql|sqlite|db|ini|conf|config|log|bak|backup)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to backup and temp directories
    location ~ ^/(backup|backups|temp|tmp|\.well-known(?!/acme-challenge)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/medical-platform-access.log combined;
    error_log /var/log/nginx/medical-platform-error.log warn;

    # Buffer settings for uploads
    client_body_buffer_size 128k;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    # Timeouts
    keepalive_timeout 75s;
    send_timeout 60s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}