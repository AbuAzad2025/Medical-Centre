name: test-env
description: >-
  Shared setup for DB-backed test jobs: Python deps, PostgreSQL client,
  Alembic migrations (RLS policies), and the restricted runtime role used by
  the SQL-level RLS tests. Requires postgres (and redis) services on the job.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary pytest-split pytest-cov

    - name: Install PostgreSQL client (pg_dump/psql)
      shell: bash
      run: |
        for i in 1 2 3 4 5; do
          sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 postgresql-client && exit 0
          echo "apt-get failed (attempt $i), retrying in 10s..."
          sleep 10
        done
        echo "Failed to install postgresql-client after retries" >&2
        exit 1

    # Apply migrations so RLS policies exist for the SQL-level enforcement
    # tests (the suite itself uses db.create_all and is unaffected — it
    # connects as the postgres superuser, which always bypasses RLS).
    - name: Run database migrations (RLS policies)
      shell: bash
      run: python -m flask db upgrade heads

    # Restricted role for SQL-level RLS tests only (NOBYPASSRLS). The test
    # file connects via RLS_TEST_DATABASE_URL; everything else keeps using
    # the superuser connection.
    - name: Create restricted runtime role for RLS tests
      shell: bash
      run: |
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
        DROP ROLE IF EXISTS med_app_runtime;
        CREATE ROLE med_app_runtime WITH LOGIN PASSWORD 'rlstest'
          NOSUPERUSER NOINHERIT NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        GRANT USAGE ON SCHEMA public TO med_app_runtime;
        GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO med_app_runtime;
        GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO med_app_runtime;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO med_app_runtime;
        ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
          GRANT USAGE ON SEQUENCES TO med_app_runtime;
        SQL
