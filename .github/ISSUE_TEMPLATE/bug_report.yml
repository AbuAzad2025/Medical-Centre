name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill in all required fields.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected module
      options:
        - Reception / Patients
        - Doctor / Clinical
        - Lab
        - Radiology
        - Pharmacy
        - Emergency
        - Nursing
        - Billing / Finance
        - Appointments / Booking
        - SaaS / Tenant
        - Auth / Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (data loss, security, system down)
        - High (core workflow blocked)
        - Medium (workaround exists)
        - Low (cosmetic, minor UX)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'e.g. production, staging, local dev (Windows/Linux, browser)'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant log output or attach screenshots.
