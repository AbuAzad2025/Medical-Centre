# re-register workflow after force-push history rewrite
name: CI

on:
  schedule:
    - cron: "0 9 * * 1"   # Monday 09:00 UTC — weekly stale action item audit
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Python Static Analysis & Security Gate ---------------------------------
  # STRICT gates (fail the build on breach): ruff formatting, ruff
  # undefined-name bugcheck (F821/F823), mypy (strict config), pip-audit,
  # bandit -lll (HIGH-severity SAST).
  # PROGRESSIVE reporting: full `ruff check --statistics` (legacy style
  # baseline -- reports without failing).
  static-analysis-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.4 mypy pip-audit bandit types-requests

      - name: Auto-fix import sorting (EOL normalization)
        run: ruff check . --select I001 --fix

      - name: Ruff lint overview (strict — legacy debt eliminated)
        run: ruff check . --statistics

      - name: Ruff format check (strict)
        run: ruff format --check .

      - name: Ruff undefined-name bug check (strict)
        run: ruff check --select F821,F823 .

      - name: Mypy type checking (strict)
        run: mypy app/ services/ routes/ models/ utils/ --explicit-package-bases

      - name: Pip-audit (CVE dependency scan -- strict)
        run: pip-audit -r requirements.txt

      - name: Bandit SAST -- high severity only (strict)
        run: bandit -r app/ services/ routes/ -lll

  # ── Frontend JavaScript Unit Tests (Vitest) ──────────────────────────────
  frontend-javascript-tests:
    name: JavaScript unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npx vitest run --pool=threads --reporter=verbose --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: cov-data-frontend
          path: coverage/coverage-final.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  # ── Agent1 Reception Deep Test (VSM-compliant, extended timeout) ───────────
  agent1-reception:
    name: Agent1 Reception Deep Tests (VSM-compliant)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: medical_system_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Set up test database
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          echo "" | base64 -d | python
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install psycopg2-binary pytest-split
      - name: Run agent1 reception tests (VSM-compliant)
        env:
          SECRET_KEY: ci-test-secret-key
          APP_ENV: testing
          FLASK_ENV: testing
          DATABASE_URL: postgresql://postgres:123@localhost:5432/medical_system_test
          TEST_DATABASE_URL: postgresql://postgres:123@localhost:5432/medical_system_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          RLS_BYPASS_ALLOWED: "1"
          ENABLE_SAAS_MODE: "true"
          SKIP_PLATFORM_BOOTSTRAP: "1"
          SUPPRESS_LOGGING: "1"
          SUPPRESS_BACKGROUND_WORKER: "1"
          CELERY_ENABLED: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
        run: |
          python -m pytest tests/test_agent1_reception.py -v --tb=short --no-header -q
      - name: Upload agent1 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-reception-results
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore

  # ── Templates & i18n Validation Gate ───────────────────────────────────────
  templates-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Jinja2
        run: |
          python -m pip install --upgrade pip
          pip install jinja2

      - name: Jinja2 syntax parse gate (all templates)
        run: |
          python - <<'PY'
          import glob, sys
          from jinja2 import Environment, TemplateSyntaxError

          env = Environment()
          files = sorted(glob.glob('templates/**/*.html', recursive=True))
          errs = 0
          for path in files:
              # parse() validates SYNTAX only (unclosed blocks / bad tags).
              # It does NOT resolve custom app filters (e.g. 'enum_label',
              # 'format_datetime'), so those templates still parse cleanly.
              try:
                  with open(path, encoding='utf-8') as fh:
                      env.parse(fh.read())
              except TemplateSyntaxError as e:
                  print(f'JINJA SYNTAX ERROR in {path}: {e}')
                  errs += 1
              except Exception as e:
                  print(f'ERROR reading {path}: {e}')
                  errs += 1
          if errs:
              print(f'FAILED: {errs} template syntax errors')
              sys.exit(1)
          print(f'OK: {len(files)} templates parsed cleanly')
          PY

      - name: i18n hardcoded-string lint (progressive -- legacy baseline)
        continue-on-error: true
        run: |
          python - <<'PY'
          import glob, re, sys
          HARD = re.compile(r'[A-Za-z]{3,}\s+[A-Za-z]{3,}(\s+[A-Za-z]+){1,}')
          SKIPS = ('aria-', 'http', 'data-', 'colspan', 'rowspan', '<', '&',
                   'xmlns', 'charset', 'viewport', 'content=', 'name=', 'property=')
          issues = 0
          for path in sorted(glob.glob('templates/**/*.html', recursive=True)):
              src = open(path, encoding='utf-8').read()
              cleaned = re.sub(r'{{.*?}}', ' ', src, flags=re.S)
              cleaned = re.sub(r'{%.*?%}', ' ', cleaned, flags=re.S)
              for m in re.finditer(r'>([^<]+)<', cleaned):
                  text = m.group(1).strip()
                  if not text:
                      continue
                  if text.startswith('_('):
                      continue
                  if HARD.search(text) and not any(text.lower().startswith(s) for s in SKIPS):
                      print(f"I18N WARN {path}: possible hardcoded string -> {text[:70]!r}")
                      issues += 1
          if issues:
              print(f"\nPROGRESSIVE: {issues} potential unlocalised strings found")
              sys.exit(0)
          print("OK: no obvious unlocalised user-facing strings in templates")
          PY

  # ── Frontend CSS & Codebase Hygiene Gate ───────────────────────────────────
  # stylelint + cspell are progressive gates on the legacy CSS/translation
  # base; they report and can be hardened to strict later.
  frontend-spelling-css:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend tooling
        continue-on-error: true
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Stylelint (CSS audit - progressive)
        continue-on-error: true
        run: npx stylelint "static/css/**/*.css" || true

      - name: CSpell (project-wide spellcheck - progressive)
        continue-on-error: true
        run: npx cspell "**/*.{py,html,js,css,md,json,toml,yaml,yml,sql,ini,cfg,sh,bat,ps1}" --no-progress || true

  # ── CI Workflow Integrity Gate ───────────────────────────────────────────────
  workflow-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: ActionLint (CI YAML validation)
        run: |
          set -euxo pipefail
          curl -sSfL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.2/actionlint_1.7.2_linux_amd64.tar.gz \
            -o actionlint.tar.gz
          tar -xzf actionlint.tar.gz
          ./actionlint -color

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      MIGRATE_ADMIN_URL: postgresql://postgres:testpass@localhost:5432/postgres
      MIGRATE_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_migrate_ci
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_migrate_ci

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic upgrade (fresh DB)
        run: python scripts/ci/verify_migrations.py

      - name: Audit RLS coverage
        run: python scripts/ci/audit_rls_coverage.py

      - name: Bootstrap platform catalog
        run: python scripts/ops/bootstrap_platform.py
        env:
          FLASK_ENV: production
          ENABLE_SAAS_MODE: "true"
          RLS_BYPASS_ALLOWED: "1"

      - name: Re-audit RLS coverage after bootstrap
        run: python scripts/ci/audit_rls_coverage.py

      - name: Audit orphaned tenant_id=0 rows
        run: python scripts/ops/audit_orphaned_tenant_rows.py
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_migrate_ci
          RLS_BYPASS_ALLOWED: "1"

  # ── Security audit gate ────────────────────────────────────────────────
  # Runs all 5 security audit scripts sequentially against a fresh PostgreSQL.
  # Each script starts its own flask db upgrade, so the DB is self-contained.
  # Fails fast: any non-zero exit code immediately blocks deployment.
  security-audit:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_audit
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_audit
      RLS_BYPASS_ALLOWED: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: python -m flask db upgrade heads
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_audit
          RLS_BYPASS_ALLOWED: "1"
          FLASK_APP: wsgi:app
          FLASK_ENV: testing
          APP_ENV: testing
          SECRET_KEY: ci-test-secret-key

      - name: 1/5 — Verify RLS startup guard rejects superuser
        run: python scripts/ci/verify_rls_guard_rejection.py

      - name: 2/5 — Verify RLS enforcement (runtime role + proof)
        run: python scripts/ci/verify_rls_enforcement.py

      - name: 3/5 — Audit RLS coverage on all tenant-scoped tables
        run: python scripts/ci/audit_rls_coverage.py

      - name: 4/5 — Audit orphaned tenant_id=0 rows
        run: python scripts/ops/audit_orphaned_tenant_rows.py

      - name: 5/5 — Check for stale action items
        run: python scripts/ci/audit_stale_action_items.py --stale-days 30

  # Weekly scan of the incident log for stale action items (runs Monday 09:00 UTC)
  stale-action-items:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check for stale action items
        run: python scripts/ci/audit_stale_action_items.py --stale-days 30

  # ── Static quality gate ────────────────────────────────────────────────
  # Fast, no database: Python syntax lint + workflow YAML + JSON validity.
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install flake8 pyyaml

      - name: Python lint (flake8 E9/F63/F7/F82)
        run: |
          python -m flake8 app routes services models utils tests scripts --count --select=E9,F63,F7,F82 --statistics

      - name: YAML lint (GitHub workflows)
        run: |
          python - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              with open(path, encoding='utf-8') as fh:
                  yaml.safe_load(fh)
              print('OK', path)
          PY

      - name: JSON lint (route inventory)
        run: |
          python - <<'PY'
          import json
          for path in ('route_inventory.json',):
              with open(path, encoding='utf-8') as fh:
                  json.load(fh)
              print('OK', path)
          PY

  # ── Boot verification ──────────────────────────────────────────────────
  # Proves the application factory boots cleanly and health endpoints respond.
  verify-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_boot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_boot
      RLS_BYPASS_ALLOWED: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Boot application and probe health endpoints
        run: |
          python - <<'PY'
          from app_factory import create_app
          app = create_app('testing')
          client = app.test_client()
          live = client.get('/__health')
          assert live.status_code == 200, live.status_code
          print('/__health ->', live.status_code)
          deep = client.get('/health')
          assert deep.status_code in (200, 503), deep.status_code
          print('/health ->', deep.status_code)
          print('BOOT OK')
          PY

  # ── Route / HTTP contract tests across PostgreSQL versions ─────────────
  # Curated HTTP-level test set run on PG 15, 16, and 17 to catch version
  # compatibility issues early (RLS, JSONB, exclusion constraints).
  routes:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    name: routes (PG ${{ matrix.pg }})

    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      RLS_TEST_DATABASE_URL: postgresql://med_app_runtime:rlstest@localhost:5432/medical_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENABLE_SAAS_MODE: "true"
      RLS_BYPASS_ALLOWED: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_e2e

    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        uses: ./.github/actions/test-env

      - name: Run route/HTTP tests
        run: |
          python -m pytest -q --tb=short \
            tests/test_route_inventory.py \
            tests/test_e2e_api.py \
            tests/test_auth.py \
            tests/test_tenant_route_isolation.py

  # ── Unit tests ─────────────────────────────────────────────────────────
  unit:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    name: unit (PG 16)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      RLS_TEST_DATABASE_URL: postgresql://med_app_runtime:rlstest@localhost:5432/medical_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENABLE_SAAS_MODE: "true"
      RLS_BYPASS_ALLOWED: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_e2e
      COVERAGE_FILE: .coverage.unit

    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        uses: ./.github/actions/test-env

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -q --tb=short \
            --cov=app --cov=routes --cov=services --cov=models --cov=utils \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: cov-data-unit
          path: .coverage.unit
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ── Integration tests ──────────────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    name: integration (PG 16)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      RLS_TEST_DATABASE_URL: postgresql://med_app_runtime:rlstest@localhost:5432/medical_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENABLE_SAAS_MODE: "true"
      RLS_BYPASS_ALLOWED: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_e2e
      COVERAGE_FILE: .coverage.integration

    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        uses: ./.github/actions/test-env

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -q --tb=short \
            --cov=app --cov=routes --cov=services --cov=models --cov=utils \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: cov-data-integration
          path: .coverage.integration
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ── Clinical safety tests ──────────────────────────────────────────────
  clinical:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    name: clinical (PG 16)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      RLS_TEST_DATABASE_URL: postgresql://med_app_runtime:rlstest@localhost:5432/medical_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENABLE_SAAS_MODE: "true"
      RLS_BYPASS_ALLOWED: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_e2e
      COVERAGE_FILE: .coverage.clinical

    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        uses: ./.github/actions/test-env

      - name: Run clinical tests
        run: |
          python -m pytest tests/clinical/ -q --tb=short \
            --cov=app --cov=routes --cov=services --cov=models --cov=utils \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: cov-data-clinical
          path: .coverage.clinical
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # ── Core suite (root test files), sharded 4-way for parallelism ────────
  core:
    runs-on: ubuntu-latest
    needs: migrate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    name: core (PG 16)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medical_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-test-secret-key
      APP_ENV: testing
      FLASK_ENV: testing
      FLASK_APP: wsgi:app
      SUPPRESS_BACKGROUND_WORKER: "1"
      SUPPRESS_LOGGING: "1"
      TEST_DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/medical_test
      RLS_TEST_DATABASE_URL: postgresql://med_app_runtime:rlstest@localhost:5432/medical_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "true"
      ENABLE_SAAS_MODE: "true"
      RLS_BYPASS_ALLOWED: "1"
      STRIPE_SECRET_KEY: sk_test_ci_e2e
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_e2e
      COVERAGE_FILE: .coverage.core.${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v5

      - name: Prepare test environment
        uses: ./.github/actions/test-env

      - name: Run core tests (shard ${{ matrix.shard }}/4)
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/unit --ignore=tests/integration --ignore=tests/clinical \
            --ignore=tests/test_route_inventory.py --ignore=tests/test_e2e_api.py \
            --ignore=tests/test_auth.py --ignore=tests/test_tenant_route_isolation.py \
            --splits 4 --group ${{ matrix.shard }} \
            --cov=app --cov=routes --cov=services --cov=models --cov=utils \
            --cov-report=

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        with:
          name: cov-data-core-${{ matrix.shard }}
          path: .coverage.core.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

# ── Coverage aggregation ───────────────────────────────────────────────
  coverage-report:
    runs-on: ubuntu-latest
    needs: [core, unit, integration, clinical, frontend-javascript-tests]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install coverage
        run: pip install coverage

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: cov-data-*
          path: covdata
          merge-multiple: true

      - name: Combine Python coverage and report
        run: |
          coverage combine covdata
          coverage report
          coverage json -o coverage.json
      - name: Coverage summary (Python)
        run: |
          echo "" | base64 -d | python

      - name: Report frontend coverage
        if: always()
        run: |
          if [ -f covdata/coverage-final.json ]; then
            echo "" | base64 -d | python
          else
            echo "Frontend coverage artifact not found"
          fi

