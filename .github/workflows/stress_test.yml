name: Stress & Concurrency Tests

on:
  pull_request:
    branches:
      - main
      - master
      - dev
    paths:
      - 'app/**'
      - 'services/**'
      - 'routes/**'
      - 'models/**'
      - 'scripts/stress_test.py'
      - '.github/workflows/stress_test.yml'

concurrency:
  group: stress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_center_test
  FLASK_ENV: testing
  APP_ENV: testing
  SECRET_KEY: ci-stress-secret-key-for-tests-min32
  PYTHONUNBUFFERED: '1'

jobs:
  stress-test:
    name: Financial Concurrency Stress Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_center_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          flask db upgrade || flask db stamp head

      - name: Run stress tests
        run: |
          python -m scripts.stress_test --test all --concurrency 10 --iterations 50
        continue-on-error: true

      - name: Upload stress test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stress-test-reports
          path: reports/stress_tests/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Display test summary
        if: always()
        run: |
          echo "=== Stress Test Complete ==="
          echo "Reports saved to: reports/stress_tests/"
          if ls reports/stress_tests/*.json 1> /dev/null 2>&1; then
            echo "Available reports:"
            ls -la reports/stress_tests/*.json
          else
            echo "No reports generated"
          fi
