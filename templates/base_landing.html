<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AZAD Medical — منصة أزاد الطبية{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.rtl.min.css') }}">
    <style>
        *, ::before, ::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --lp-navy: #0c4a6e;
            --lp-navy-dark: #082f4a;
            --lp-teal: #0d9488;
            --lp-text: #0f172a;
            --lp-text-sec: #475569;
            --lp-text-muted: #94a3b8;
            --lp-bg: #f0f5fa;
            --lp-surface: #ffffff;
            --lp-border: #e2e8f0;
            --lp-radius: 12px;
            --lp-shadow-sm: 0 1px 3px rgba(12,74,110,0.04);
            --lp-shadow-md: 0 4px 16px rgba(12,74,110,0.06);
            --lp-font: 'Cairo', system-ui, -apple-system, sans-serif;
        }
        body {
            font-family: var(--lp-font);
            direction: rtl;
            background: var(--lp-bg);
            color: var(--lp-text);
            -webkit-font-smoothing: antialiased;
            line-height: 1.6;
        }
        .lp-header {
            background: var(--lp-surface);
            border-bottom: 1px solid var(--lp-border);
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .lp-header .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: var(--lp-text);
            text-decoration: none;
        }
        .lp-header .brand .logo-mark {
            width: 34px; height: 34px;
            background: var(--lp-navy);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
        }
        .lp-header .brand .brand-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--lp-text);
        }
        .lp-header .brand .brand-name small {
            font-size: 0.6rem;
            color: var(--lp-text-muted);
            font-weight: 400;
            display: block;
            line-height: 1.2;
        }
        .lp-header .nav-links {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }
        .lp-header .nav-links a {
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--lp-text-sec);
            transition: color 0.2s;
        }
        .lp-header .nav-links a:hover { color: var(--lp-navy); }
        .lp-header .nav-links .btn-login {
            background: var(--lp-navy);
            color: #fff;
            padding: 0.45rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .lp-header .nav-links .btn-login:hover { background: var(--lp-navy-dark); color: #fff; }
        .lp-hero {
            background: linear-gradient(145deg, var(--lp-navy-dark) 0%, var(--lp-navy) 50%, var(--lp-teal) 100%);
            color: #fff;
            padding: 5rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .lp-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(13,148,136,0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .lp-hero .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 0.3rem 1rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1.5rem;
            position: relative;
        }
        .lp-hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 0.75rem;
            position: relative;
            line-height: 1.3;
        }
        .lp-hero h1 span { color: #5eead4; }
        .lp-hero p {
            font-size: 1.05rem;
            opacity: 0.8;
            max-width: 640px;
            margin: 0 auto 2rem;
            line-height: 1.7;
            position: relative;
        }
        .lp-hero .hero-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            position: relative;
        }
        .lp-hero .hero-actions .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--lp-font);
            border-radius: var(--lp-radius);
            text-decoration: none;
            background: #fff;
            color: var(--lp-navy);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .lp-hero .hero-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .lp-hero .hero-actions .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: var(--lp-font);
            border-radius: var(--lp-radius);
            text-decoration: none;
            border: 1.5px solid rgba(255,255,255,0.25);
            color: #fff;
            background: transparent;
            transition: border-color 0.2s, background 0.2s;
        }
        .lp-hero .hero-actions .btn-secondary:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.08);
        }
        .lp-hero .owner-link {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.82rem;
            position: relative;
        }
        .lp-hero .owner-link a {
            color: rgba(255,255,255,0.7);
            text-decoration: underline;
            font-weight: 500;
            transition: color 0.2s;
        }
        .lp-hero .owner-link a:hover { color: #fff; }
        .lp-search-tenant {
            margin-top: 2.5rem;
            padding: 0 1rem;
        }
        .lp-search-tenant .search-box {
            max-width: 520px;
            margin: 0 auto;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .lp-search-tenant .search-box input {
            flex: 1;
            min-width: 280px;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-family: var(--lp-font);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: var(--lp-radius);
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: border-color 0.2s, background 0.2s;
        }
        .lp-search-tenant .search-box input::placeholder { color: rgba(255,255,255,0.5); }
        .lp-search-tenant .search-box input:focus {
            outline: none;
            border-color: #5eead4;
            background: rgba(255,255,255,0.15);
        }
        .lp-search-tenant .search-box button {
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--lp-font);
            border-radius: var(--lp-radius);
            border: none;
            background: #fff;
            color: var(--lp-navy);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }
        .lp-search-tenant .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        .lp-section {
            padding: 4rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .lp-section-title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--lp-text);
            margin-bottom: 0.5rem;
        }
        .lp-section-subtitle {
            text-align: center;
            color: var(--lp-text-muted);
            font-size: 0.95rem;
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-inline-start: auto;
            margin-right: auto;
        }
        .cap-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 1rem;
        }
        .cap-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.15rem;
            background: var(--lp-surface);
            border: 1px solid var(--lp-border);
            border-radius: var(--lp-radius);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .cap-item:hover {
            border-color: var(--lp-navy);
            box-shadow: var(--lp-shadow-sm);
        }
        .cap-item .cap-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            background: #eef2f7;
            color: var(--lp-navy);
        }
        .cap-item .cap-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--lp-text);
            line-height: 1.3;
        }
        .lp-overview {
            background: var(--lp-surface);
            border-top: 1px solid var(--lp-border);
            border-bottom: 1px solid var(--lp-border);
        }
        .lp-overview .overview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
        }
        .lp-overview .overview-item {
            text-align: center;
            padding: 1.5rem 1rem;
        }
        .lp-overview .overview-item h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--lp-text);
            margin-bottom: 0.4rem;
        }
        .lp-overview .overview-item p {
            font-size: 0.85rem;
            color: var(--lp-text-muted);
            line-height: 1.6;
        }
        .lp-overview .overview-item .ov-icon {
            font-size: 1.5rem;
            color: var(--lp-navy);
            margin-bottom: 0.75rem;
        }
        .lp-contact {
            text-align: center;
            padding: 3.5rem 2rem;
        }
        .lp-contact h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--lp-text);
            margin-bottom: 0.5rem;
        }
        .lp-contact p {
            color: var(--lp-text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }
        .lp-contact .contact-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .lp-contact .contact-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.65rem 1.25rem;
            border-radius: var(--lp-radius);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            background: var(--lp-surface);
            border: 1px solid var(--lp-border);
            color: var(--lp-text-sec);
            transition: border-color 0.2s, color 0.2s;
        }
        .lp-contact .contact-links a:hover {
            border-color: var(--lp-navy);
            color: var(--lp-navy);
        }
        .lp-contact .contact-links a.whatsapp { color: #059669; }
        .lp-contact .contact-links a.whatsapp:hover { border-color: #059669; color: #047857; }
        .lp-footer {
            background: var(--lp-navy-dark);
            color: rgba(255,255,255,0.5);
            padding: 1.5rem 2rem;
            text-align: center;
            font-size: 0.78rem;
        }
        .lp-footer .links {
            display: flex;
            justify-content: center;
            gap: 1.25rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .lp-footer .links a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.78rem;
            transition: color 0.2s;
        }
        .lp-footer .links a:hover { color: #5eead4; }
        .lp-footer strong { color: rgba(255,255,255,0.7); }
        @media (max-width: 768px) {
            .lp-header { padding: 0 1rem; }
            .lp-header .brand .brand-name small { display: none; }
            .lp-hero { padding: 3rem 1rem; }
            .lp-hero h1 { font-size: 1.8rem; }
            .lp-hero p { font-size: 0.95rem; }
            .lp-section { padding: 2.5rem 1rem; }
            .lp-section-title { font-size: 1.3rem; }
            .cap-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .cap-item { padding: 0.8rem 1rem; }
            .lp-overview .overview-grid { grid-template-columns: 1fr 1fr; }
            .lp-contact { padding: 2.5rem 1rem; }
            .lp-hero .hero-actions { flex-direction: column; align-items: center; }
            .lp-hero .hero-actions .btn-primary, .lp-hero .hero-actions .btn-secondary { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .lp-header .nav-links .btn-login span { display: none; }
            .lp-overview .overview-grid { grid-template-columns: 1fr; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
