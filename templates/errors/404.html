<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — الصفحة غير متاحة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --color-primary: #0f4c81;
            --color-info: #0ea5e9;
            --color-bg: #f4f7fb;
            --color-surface: #ffffff;
            --color-border: #e2e8f0;
            --color-text: #0f172a;
            --color-text-muted: #64748b;
            --radius-lg: 0.875rem;
            --shadow-lg: 0 4px 16px rgb(0 0 0 / 6%), 0 8px 24px rgb(0 0 0 / 6%);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background: var(--color-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            color: var(--color-text);
        }
        .error-card {
            background: var(--color-surface);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 480px;
            width: 100%;
            padding: 3rem 2rem;
            text-align: center;
            border: 1px solid var(--color-border);
        }
        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-info);
            font-size: 2rem;
        }
        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--color-info);
            line-height: 1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 0.75rem;
        }
        .error-desc {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn-back {
            background: var(--color-primary);
            color: #fff;
            border: none;
            padding: 0.7rem 1.75rem;
            border-radius: 0.625rem;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-back:hover {
            background: #0a365a;
            color: #fff;
            transform: translateY(-1px);
        }
        @media (max-width: 480px) {
            .error-card { padding: 2rem 1.25rem; }
            .error-code { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
        </div>
        <div class="error-code">404</div>
        <div class="error-title">الصفحة غير متاحة</div>
        <p class="error-desc">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يرجى التحقق من الرابط أو العودة للصفحة الرئيسية.</p>
        <a href="/" class="btn-back">
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
            العودة للصفحة الرئيسية
        </a>
    </div>
</body>
</html>
