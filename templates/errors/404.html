<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — الصفحة غير متاحة</title>
    <link href="/static/vendor/fonts/fonts.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.rtl.min.css') }}" rel="stylesheet">
    <style>
        :root { --md-navy: #0c4a6e; --md-navy-dark: #082f4a; --md-teal: #0d9488; --md-text: #0f172a; --md-text-sec: #475569; --md-text-muted: #94a3b8; --md-bg: #f0f5fa; --md-card: #ffffff; --md-border: #e2e8f0; --md-radius: 12px; --md-shadow: 0 8px 32px rgba(12,74,110,0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', system-ui, sans-serif; background: var(--md-bg); min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 1rem; color: var(--md-text); -webkit-font-smoothing: antialiased; }
        .error-card { background: var(--md-card); border-radius: var(--md-radius); box-shadow: var(--md-shadow); max-width: 440px; width: 100%; padding: 3rem 2rem; text-align: center; }
        .error-icon { width: 72px; height: 72px; margin: 0 auto 1.25rem; border-radius: 50%; background: rgba(14,165,233,0.08); display: flex; align-items: center; justify-content: center; color: #0ea5e9; font-size: 1.75rem; }
        .error-code { font-size: 3rem; font-weight: 800; color: #0ea5e9; line-height: 1; margin-bottom: 0.5rem; }
        .error-title { font-size: 1.15rem; font-weight: 700; color: var(--md-text); margin-bottom: 0.5rem; }
        .error-desc { color: var(--md-text-sec); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.75rem; }
        .btn-back { display: inline-flex; align-items: center; gap: 0.4rem; background: var(--md-navy); color: #fff; border: none; padding: 0.65rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: 0.9rem; font-family: 'Cairo', sans-serif; text-decoration: none; transition: background 0.2s; }
        .btn-back:hover { background: var(--md-navy-dark); color: #fff; }
        @media (max-width: 480px) { .error-card { padding: 2rem 1.25rem; } .error-code { font-size: 2.5rem; } }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="fas fa-magnifying-glass" aria-hidden="true"></i></div>
        <div class="error-code">404</div>
        <div class="error-title">الصفحة غير متاحة</div>
        <p class="error-desc">عذراً، الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يرجى التحقق من الرابط أو العودة للصفحة الرئيسية.</p>
        <a href="/" class="btn-back"><i class="fas fa-arrow-right" aria-hidden="true"></i> العودة للصفحة الرئيسية</a>
    </div>
</body>
</html>
