{% extends "base.html" %}
{% block title %}أمر شراء جديد{% endblock %}

{% block content %}
<div class="container-fluid">
  <h4 class="mb-3"><i class="fas fa-plus-circle me-2 text-primary"></i>أمر شراء جديد</h4>

  <form id="po-form" method="post"
        action="{{ url_for('procurement.create_po') }}"
        data-validate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="card shadow-sm mb-3">
      <div class="card-body row g-3">
        <div class="col-md-4">
          <label class="form-label" for="supplier_id">المورد <span class="text-danger">*</span></label>
          <select class="form-select" id="supplier_id" name="supplier_id" required data-validate="required">
            <option value="">— اختر المورد —</option>
            {% for s in suppliers %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
          <div class="invalid-feedback">اختيار المورد مطلوب</div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>أصناف الطلب</span>
        <button type="button" class="btn btn-outline-primary btn-sm" id="add-line">
          <i class="fas fa-plus me-1"></i>إضافة صنف
        </button>
      </div>
      <div class="card-body table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead class="table-light">
            <tr><th style="min-width:220px">الدواء</th><th>الكمية</th><th>سعر الشراء</th><th>رقم التشغيلة</th><th>تاريخ الانتهاء</th><th></th></tr>
          </thead>
          <tbody id="po-lines">
            <tr class="po-line">
              <td>
                <select class="form-select form-select-sm" name="medication_id[]" required>
                  <option value="">— اختر —</option>
                  {% for m in medications %}
                  <option value="{{ m.id }}">{{ m.trade_name }}{{ (' — ' ~ m.scientific_name) if m.scientific_name }}</option>
                  {% endfor %}
                </select>
              </td>
              <td><input type="number" class="form-control form-control-sm" name="quantity[]" min="1" value="1" required></td>
              <td><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="purchase_price[]" placeholder="0.00"></td>
              <td><input type="text" class="form-control form-control-sm" name="batch_number[]" maxlength="60" required dir="auto"></td>
              <td><input type="date" class="form-control form-control-sm" name="expiry_date[]"></td>
              <td><button type="button" class="btn btn-outline-danger btn-sm btn-del-line" title="حذف السطر"><i class="fas fa-trash"></i></button></td>
            </tr>
          </tbody>
        </table>
        <div class="text-danger small mt-2 d-none" id="po-error"></div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="fas fa-save me-1"></i>حفظ أمر الشراء
      </button>
      <a href="{{ url_for('procurement.list_purchases') }}" class="btn btn-outline-secondary">إلغاء</a>
    </div>
  </form>
</div>
{% endblock %}

{% block extra_js %}
<script nonce="{{ g.csp_nonce if g is defined and g.csp_nonce else '' }}">
(function () {
  'use strict';

  var medOptions = '';
  document.querySelectorAll('#po-lines tr:first-child select option').forEach(function (o) {
    medOptions += o.outerHTML;
  });

  function addLine() {
    var tbody = document.getElementById('po-lines');
    var tr = document.createElement('tr');
    tr.className = 'po-line';
    tr.innerHTML =
      '<td><select class="form-select form-select-sm" name="medication_id[]" required>' + medOptions + '</select></td>' +
      '<td><input type="number" class="form-control form-control-sm" name="quantity[]" min="1" value="1" required></td>' +
      '<td><input type="number" step="0.01" min="0" class="form-control form-control-sm" name="purchase_price[]" placeholder="0.00"></td>' +
      '<td><input type="text" class="form-control form-control-sm" name="batch_number[]" maxlength="60" required dir="auto"></td>' +
      '<td><input type="date" class="form-control form-control-sm" name="expiry_date[]"></td>' +
      '<td><button type="button" class="btn btn-outline-danger btn-sm btn-del-line"><i class="fas fa-trash"></i></button></td>';
    tbody.appendChild(tr);
  }

  document.getElementById('add-line').addEventListener('click', addLine);

  document.getElementById('po-lines').addEventListener('click', function (e) {
    var del = e.target.closest('.btn-del-line');
    if (!del) return;
    var lines = document.querySelectorAll('.po-line');
    if (lines.length > 1) {
      del.closest('tr').remove();
    } else {
      alert('يجب إبقاء سطر واحد على الأقل');
    }
  });

  document.getElementById('po-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = document.getElementById('po-error');
    err.classList.add('d-none');

    var supplier = document.getElementById('supplier_id').value;
    if (!supplier) {
      err.textContent = 'اختيار المورد مطلوب';
      err.classList.remove('d-none');
      return;
    }
    var items = [];
    document.querySelectorAll('.po-line').forEach(function (tr) {
      var mid = tr.querySelector('[name="medication_id[]"]').value;
      var qty = parseInt(tr.querySelector('[name="quantity[]"]').value, 10) || 0;
      var price = parseFloat(tr.querySelector('[name="purchase_price[]"]').value) || 0;
      var batch = tr.querySelector('[name="batch_number[]"]').value.trim();
      if (mid && qty > 0 && batch) {
        items.push({
          medication_id: parseInt(mid, 10),
          quantity: qty,
          purchase_price: price,
          batch_number: batch,
          expiry_date: tr.querySelector('[name="expiry_date[]"]').value || null
        });
      }
    });
    if (!items.length) {
      err.textContent = 'أضف صنفاً واحداً على الأقل مع الكمية ورقم التشغيلة';
      err.classList.remove('d-none');
      return;
    }

    fetch(this.action, {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': this.querySelector('[name="csrf_token"]').value,
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: JSON.stringify({ supplier_id: parseInt(supplier, 10), items: items })
    })
      .then(function (r) { return r.json().catch(function () { throw new Error(r.status); }); })
      .then(function (j) {
        if (j.success) {
          window.location.href = '/procurement/';
        } else {
          err.textContent = j.message || 'تعذر الحفظ';
          err.classList.remove('d-none');
        }
      })
      .catch(function () {
        err.textContent = 'حدث خطأ أثناء الحفظ. حاول مرة أخرى.';
        err.classList.remove('d-none');
      });
  });
})();
</script>
{% endblock %}
