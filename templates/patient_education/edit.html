{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
  <h4><i class="bi bi-book me-2"></i>{{ _(_('تعديل مادة تعليمية')) }}</h4>
  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="title" class="form-label">{{ _(_('العنوان')) }}</label>
          <input type="text" class="form-control" id="title" name="title" value="{{ material.title }}" required>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="category" class="form-label">{{ _(_('التصنيف')) }}</label>
            <select class="form-select" id="category" name="category">
              <option value="medication" {% if material.category == 'medication' %}selected{% endif %}>{{ _(_('دواء')) }}</option>
              <option value="disease" {% if material.category == 'disease' %}selected{% endif %}>{{ _(_('مرض')) }}</option>
              <option value="procedure" {% if material.category == 'procedure' %}selected{% endif %}>{{ _(_('إجراء')) }}</option>
              <option value="lifestyle" {% if material.category == 'lifestyle' %}selected{% endif %}>{{ _(_('نمط حياة')) }}</option>
              <option value="nutrition" {% if material.category == 'nutrition' %}selected{% endif %}>{{ _(_('تغذية')) }}</option>
              <option value="post_op" {% if material.category == 'post_op' %}selected{% endif %}>{{ _(_('ما بعد الجراحة')) }}</option>
              <option value="general" {% if material.category == 'general' %}selected{% endif %}>{{ _(_('عام')) }}</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="language" class="form-label">{{ _(_('اللغة')) }}</label>
            <select class="form-select" id="language" name="language">
              <option value="ar" {% if material.language == 'ar' %}selected{% endif %}>{{ _(_('العربية')) }}</option>
              <option value="en" {% if material.language == 'en' %}selected{% endif %}>English</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label for="content_html" class="form-label">{{ _(_('محتوى HTML')) }}</label>
          <textarea class="form-control" id="content_html" name="content_html" rows="5">{{ material.content_html or '' }}</textarea>
        </div>
        <div class="mb-3">
          <label for="content_text" class="form-label">{{ _(_('نص بديل')) }}</label>
          <textarea class="form-control" id="content_text" name="content_text" rows="3">{{ material.content_text or '' }}</textarea>
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if material.is_active %}checked{% endif %}>
          <label class="form-check-label" for="is_active">{{ _(_('مفعّل')) }}</label>
        </div>
        <div class="mb-3">
          <label for="file" class="form-label">{{ _(_('ملف مرفق جديد (اختياري)')) }}</label>
          <input type="file" class="form-control" id="file" name="file" accept=".pdf,.png,.jpg,.jpeg,.gif,.mp4,.webm">
          {% if material.file_path %}<div class="mt-1"><small>{{ _(_('الملف الحالي:')) }} <a href="{{ material.file_path }}" target="_blank">{{ _(_('عرض')) }}</a></small></div>{% endif %}
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">{{ _(_('تحديث')) }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
